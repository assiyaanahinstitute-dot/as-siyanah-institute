<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Manage Subjects | As-Siyānah Institute</title>

    <link rel="stylesheet" href="admin-style.css">

    <style>
        .subjects-page {
            max-width: 1150px;
            margin: 0 auto;
        }

        .subjects-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 25px;
        }

        .subjects-header h2 {
            margin: 0;
            color: #0b3524;
            font-size: 28px;
        }

        .subjects-header p {
            margin: 8px 0 0;
            color: #6f7d76;
            font-size: 14px;
        }

        .add-subject-button {
            border: none;
            background: #1d5e3c;
            color: white;
            padding: 12px 18px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
        }

        .add-subject-button:hover {
            background: #0b3524;
        }

        .subjects-toolbar {
            background: #ffffff;
            border: 1px solid #e2eae5;
            border-radius: 14px;
            padding: 18px;
            margin-bottom: 20px;
        }

        .subjects-search {
            width: 100%;
            box-sizing: border-box;
            padding: 12px 14px;
            border: 1px solid #d7e2dc;
            border-radius: 10px;
            outline: none;
            font-family: inherit;
            font-size: 14px;
        }

        .subjects-search:focus {
            border-color: #1d5e3c;
            box-shadow: 0 0 0 3px rgba(29, 94, 60, 0.08);
        }

        .subjects-card {
            background: #ffffff;
            border: 1px solid #e2eae5;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(11, 53, 36, 0.05);
        }

        .subjects-table-wrapper {
            overflow-x: auto;
        }

        .subjects-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 750px;
        }

        .subjects-table th {
            background: #f4f8f5;
            color: #365044;
            text-align: left;
            padding: 14px 16px;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .subjects-table td {
            padding: 15px 16px;
            border-top: 1px solid #edf1ee;
            color: #33473d;
            font-size: 13px;
        }

        .subject-name {
            font-weight: 700;
            color: #0b3524;
        }

        .subject-description {
            max-width: 300px;
            color: #718078;
        }

        .status-badge {
            display: inline-block;
            padding: 5px 9px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
        }

        .status-active {
            background: #eaf7ef;
            color: #17633d;
        }

        .status-inactive {
            background: #f8eeee;
            color: #9a3b3b;
        }

        .subject-actions {
            display: flex;
            gap: 7px;
        }

        .subject-action {
            border: 1px solid #d6e3da;
            background: #f3f8f5;
            color: #1d5e3c;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
        }

        .subject-action:hover {
            background: #1d5e3c;
            color: #ffffff;
        }

        .delete-subject {
            color: #a13d3d;
            border-color: #ecd4d4;
            background: #fff7f7;
        }

        .delete-subject:hover {
            background: #a13d3d;
            border-color: #a13d3d;
            color: #ffffff;
        }

        .subjects-message {
            padding: 20px;
            text-align: center;
            color: #718078;
            font-size: 13px;
        }

        /* MODAL */

        .subject-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(5, 25, 16, 0.55);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .subject-modal.active {
            display: flex;
        }

        .subject-modal-card {
            width: 100%;
            max-width: 560px;
            background: #ffffff;
            border-radius: 18px;
            padding: 28px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.18);
        }

        .subject-modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 22px;
        }

        .subject-modal-header h3 {
            margin: 0;
            color: #0b3524;
        }

        .close-modal {
            border: none;
            background: #f2f5f3;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
            color: #42554b;
        }

        .subject-form {
            display: grid;
            gap: 16px;
        }

        .subject-form label {
            display: block;
            margin-bottom: 7px;
            font-size: 13px;
            font-weight: 700;
            color: #294438;
        }

        .subject-form input,
        .subject-form textarea,
        .subject-form select {
            width: 100%;
            box-sizing: border-box;
            border: 1px solid #d8e3dd;
            border-radius: 10px;
            padding: 11px 13px;
            font-family: inherit;
            font-size: 14px;
            outline: none;
        }

        .subject-form textarea {
            min-height: 90px;
            resize: vertical;
        }

        .subject-form input:focus,
        .subject-form textarea:focus,
        .subject-form select:focus {
            border-color: #1d5e3c;
            box-shadow: 0 0 0 3px rgba(29, 94, 60, 0.08);
        }

        .subject-form-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 5px;
        }

        .cancel-button {
            border: 1px solid #d7e1dc;
            background: #f7f9f8;
            color: #52635a;
            padding: 11px 17px;
            border-radius: 9px;
            font-weight: 700;
            cursor: pointer;
        }

        .save-subject-button {
            border: none;
            background: #1d5e3c;
            color: #ffffff;
            padding: 11px 18px;
            border-radius: 9px;
            font-weight: 700;
            cursor: pointer;
        }

        .save-subject-button:hover {
            background: #0b3524;
        }

        .form-message {
            font-size: 12px;
            font-weight: 600;
            margin-top: 5px;
        }

        .form-message.error {
            color: #a13d3d;
        }

        @media (max-width: 700px) {

            .subjects-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .add-subject-button {
                width: 100%;
            }

            .subject-modal-card {
                padding: 21px;
            }
        }
    </style>
</head>

<body>

<header class="admin-header">

    <div class="admin-header-inner">

        <div class="admin-brand">
            <h1>AS-SIYĀNAH INSTITUTE</h1>
            <span>Admin Portal</span>
        </div>

    </div>

</header>


<nav class="admin-nav">

    <a href="admin-dashboard.html">
        Dashboard
    </a>

    <a href="admin-students.html">
        Students
    </a>

    <a href="admin-teachers.html">
        Teachers
    </a>

    <a href="admin-lessons.html">
        Lessons
    </a>

    <a href="admin-subjects.html" class="active">
        Subjects
    </a>

    <a href="admin-results.html">
        Results
    </a>

    <a href="admin-announcements.html">
        Announcements
    </a>

    <a href="admin-registrations.html">
        Registrations
    </a>

    <a href="admin-profile.html">
        Profile
    </a>

    <a href="admin-settings.html">
        Settings
    </a>

</nav>


<main class="admin-main">

    <div class="subjects-page">

        <div class="subjects-header">

            <div>
                <h2>Manage Subjects</h2>

                <p>
                    Create and manage the subjects offered by the institute.
                </p>
            </div>

            <button
                class="add-subject-button"
                id="addSubjectButton"
            >
                + Add Subject
            </button>

        </div>


        <div class="subjects-toolbar">

            <input
                type="text"
                id="subjectSearch"
                class="subjects-search"
                placeholder="Search subjects..."
            >

        </div>


        <div class="subjects-card">

            <div class="subjects-table-wrapper">

                <table class="subjects-table">

                    <thead>

                        <tr>

                            <th>Subject</th>
                            <th>Description</th>
                            <th>Programme</th>
                            <th>Level</th>
                            <th>Status</th>
                            <th>Actions</th>

                        </tr>

                    </thead>

                    <tbody id="subjectsTableBody">

                        <tr>
                            <td colspan="6">
                                <div class="subjects-message">
                                    Loading subjects...
                                </div>
                            </td>
                        </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</main>


<!-- SUBJECT MODAL -->

<div
    class="subject-modal"
    id="subjectModal"
>

    <div class="subject-modal-card">

        <div class="subject-modal-header">

            <h3 id="modalTitle">
                Add Subject
            </h3>

            <button
                class="close-modal"
                id="closeModalButton"
            >
                ×
            </button>

        </div>


        <form
            class="subject-form"
            id="subjectForm"
        >

            <div>

                <label for="subjectName">
                    Subject Name
                </label>

                <input
                    type="text"
                    id="subjectName"
                    required
                    placeholder="e.g. Nahwu"
                >

            </div>


            <div>

                <label for="subjectDescription">
                    Description
                </label>

                <textarea
                    id="subjectDescription"
                    placeholder="Brief description of the subject"
                ></textarea>

            </div>


            <div>

                <label for="subjectProgramme">
                    Programme
                </label>

                <input
                    type="text"
                    id="subjectProgramme"
                    placeholder="e.g. Arabic & Islamic Studies"
                >

            </div>


            <div>

                <label for="subjectLevel">
                    Level
                </label>

                <input
                    type="text"
                    id="subjectLevel"
                    placeholder="e.g. Elementary"
                >

            </div>


            <div>

                <label for="subjectActive">
                    Status
                </label>

                <select id="subjectActive">

                    <option value="true">
                        Active
                    </option>

                    <option value="false">
                        Inactive
                    </option>

                </select>

            </div>


            <div
                id="formMessage"
                class="form-message"
            ></div>


            <div class="subject-form-actions">

                <button
                    type="button"
                    class="cancel-button"
                    id="cancelSubjectButton"
                >
                    Cancel
                </button>

                <button
                    type="submit"
                    class="save-subject-button"
                >
                    Save Subject
                </button>

            </div>

        </form>

    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
    "https://ridyfpaqoyegdvqmkiyl.supabase.co";

const SUPABASE_ANON_KEY =
    "sb_publishable_dH1z6RuBIqxN88pyG9YfVA_1niXEWIh";

const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );


const subjectsTableBody =
    document.getElementById(
        "subjectsTableBody"
    );

const subjectSearch =
    document.getElementById(
        "subjectSearch"
    );

const subjectModal =
    document.getElementById(
        "subjectModal"
    );

const subjectForm =
    document.getElementById(
        "subjectForm"
    );

const modalTitle =
    document.getElementById(
        "modalTitle"
    );

const subjectName =
    document.getElementById(
        "subjectName"
    );

const subjectDescription =
    document.getElementById(
        "subjectDescription"
    );

const subjectProgramme =
    document.getElementById(
        "subjectProgramme"
    );

const subjectLevel =
    document.getElementById(
        "subjectLevel"
    );

const subjectActive =
    document.getElementById(
        "subjectActive"
    );

const formMessage =
    document.getElementById(
        "formMessage"
    );


let allSubjects = [];

let editingSubjectId = null;


// ========================================
// CHECK ADMIN
// ========================================

async function checkAdmin() {

    const {
        data: {
            user
        }
    } = await supabaseClient.auth.getUser();

    if (!user) {

        window.location.href =
            "admin-login.html";

        return false;
    }


    const {
        data: admin,
        error
    } = await supabaseClient
        .from("Admin")
        .select("role")
        .eq("auth_id", user.id)
        .single();


    if (
        error ||
        !admin ||
        admin.role !== "admin"
    ) {

        await supabaseClient.auth.signOut();

        window.location.href =
            "admin-login.html";

        return false;
    }


    return true;
}


// ========================================
// LOAD SUBJECTS
// ========================================

async function loadSubjects() {

    const {
        data,
        error
    } = await supabaseClient
        .from("Subjects")
        .select("*")
        .order("id", {
            ascending: true
        });


    if (error) {

        console.error(error);

        subjectsTableBody.innerHTML = `
            <tr>
                <td colspan="6">
                    <div class="subjects-message">
                        Unable to load subjects.
                    </div>
                </td>
            </tr>
        `;

        return;
    }


    allSubjects = data || [];

    renderSubjects(allSubjects);
}


// ========================================
// RENDER SUBJECTS
// ========================================

function renderSubjects(subjects) {

    if (!subjects.length) {

        subjectsTableBody.innerHTML = `
            <tr>
                <td colspan="6">
                    <div class="subjects-message">
                        No subjects found.
                    </div>
                </td>
            </tr>
        `;

        return;
    }


    subjectsTableBody.innerHTML =
        subjects.map(subject => `

            <tr>

                <td>
                    <div class="subject-name">
                        ${escapeHtml(subject.name)}
                    </div>
                </td>

                <td>
                    <div class="subject-description">
                        ${escapeHtml(
                            subject.description || "—"
                        )}
                    </div>
                </td>

                <td>
                    ${escapeHtml(
                        subject.programme || "—"
                    )}
                </td>

                <td>
                    ${escapeHtml(
                        subject.level || "—"
                    )}
                </td>

                <td>

                    <span class="
                        status-badge
                        ${
                            subject.active
                            ? "status-active"
                            : "status-inactive"
                        }
                    ">

                        ${
                            subject.active
                            ? "Active"
                            : "Inactive"
                        }

                    </span>

                </td>

                <td>

                    <div class="subject-actions">

                        <button
                            class="subject-action"
                            onclick="editSubject(${subject.id})"
                        >
                            Edit
                        </button>

                        <button
                            class="
                                subject-action
                                delete-subject
                            "
                            onclick="deleteSubject(${subject.id})"
                        >
                            Delete
                        </button>

                    </div>

                </td>

            </tr>

        `).join("");
}


// ========================================
// ESCAPE HTML
// ========================================

function escapeHtml(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


// ========================================
// OPEN MODAL
// ========================================

function openModal() {

    subjectModal.classList.add("active");

    subjectName.focus();
}


// ========================================
// CLOSE MODAL
// ========================================

function closeModal() {

    subjectModal.classList.remove("active");

    subjectForm.reset();

    editingSubjectId = null;

    modalTitle.textContent =
        "Add Subject";

    formMessage.textContent = "";

}


// ========================================
// ADD SUBJECT
// ========================================

document
    .getElementById("addSubjectButton")
    .addEventListener(
        "click",
        function () {

            closeModal();

            openModal();

        }
    );


// ========================================
// CLOSE BUTTONS
// ========================================

document
    .getElementById("closeModalButton")
    .addEventListener(
        "click",
        closeModal
    );


document
    .getElementById("cancelSubjectButton")
    .addEventListener(
        "click",
        closeModal
    );


// ========================================
// EDIT SUBJECT
// ========================================

window.editSubject = function(id) {

    const subject =
        allSubjects.find(
            item => item.id === id
        );

    if (!subject) return;


    editingSubjectId = id;

    modalTitle.textContent =
        "Edit Subject";

    subjectName.value =
        subject.name || "";

    subjectDescription.value =
        subject.description || "";

    subjectProgramme.value =
        subject.programme || "";

    subjectLevel.value =
        subject.level || "";

    subjectActive.value =
        String(subject.active);


    formMessage.textContent = "";

    openModal();
};


// ========================================
// SAVE SUBJECT
// ========================================

subjectForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();

        const name =
            subjectName.value.trim();

        if (!name) {

            formMessage.textContent =
                "Subject name is required.";

            formMessage.className =
                "form-message error";

            return;
        }


        const subjectData = {

            name: name,

            description:
                subjectDescription.value.trim(),

            programme:
                subjectProgramme.value.trim(),

            level:
                subjectLevel.value.trim(),

            active:
                subjectActive.value === "true",

            updated_at:
                new Date().toISOString()

        };


        let error;


        if (editingSubjectId) {

            const result =
                await supabaseClient
                    .from("Subjects")
                    .update(subjectData)
                    .eq(
                        "id",
                        editingSubjectId
                    );

            error = result.error;

        } else {

            const result =
                await supabaseClient
                    .from("Subjects")
                    .insert(
                        subjectData
                    );

            error = result.error;
        }


        if (error) {

            console.error(error);

            formMessage.textContent =
                "Unable to save subject: " +
                error.message;

            formMessage.className =
                "form-message error";

            return;
        }


        closeModal();

        await loadSubjects();

    }
);


// ========================================
// DELETE SUBJECT
// ========================================

window.deleteSubject = async function(id) {

    const subject =
        allSubjects.find(
            item => item.id === id
        );

    if (!subject) return;


    const confirmed =
        confirm(
            `Delete "${subject.name}"?`
        );


    if (!confirmed) return;


    const {
        error
    } = await supabaseClient
        .from("Subjects")
        .delete()
        .eq("id", id);


    if (error) {

        alert(
            "Unable to delete subject: " +
            error.message
        );

        return;
    }


    await loadSubjects();
};


// ========================================
// SEARCH
// ========================================

subjectSearch.addEventListener(
    "input",
    function() {

        const query =
            this.value
                .toLowerCase()
                .trim();


        const filtered =
            allSubjects.filter(subject =>

                (subject.name || "")
                    .toLowerCase()
                    .includes(query)

                ||

                (subject.description || "")
                    .toLowerCase()
                    .includes(query)

                ||

                (subject.programme || "")
                    .toLowerCase()
                    .includes(query)

                ||

                (subject.level || "")
                    .toLowerCase()
                    .includes(query)

            );


        renderSubjects(filtered);

    }
);


// ========================================
// INITIALIZE
// ========================================

async function initialize() {

    const isAdmin =
        await checkAdmin();

    if (!isAdmin) return;

    await loadSubjects();
}


initialize();
</script>

</body>
</html>
