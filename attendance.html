<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>
        My Attendance | As-Siyānah Institute
    </title>

    <link rel="stylesheet"
        href="css/style.css">

    <style>

        /* ========================================
           BACK BUTTON
        ======================================== */

        .attendance-back-button {

            display: inline-flex;

            align-items: center;

            gap: 8px;

            margin-bottom: 18px;

            padding: 9px 16px;

            border: 1px solid rgba(255,255,255,0.25);

            border-radius: 9px;

            background: rgba(255,255,255,0.08);

            color: #ffffff;

            font-size: 13px;

            font-weight: 600;

            cursor: pointer;

            transition: 0.2s ease;

        }

        .attendance-back-button:hover {

            background: rgba(255,255,255,0.16);

            transform: translateX(-3px);

        }


        /* ========================================
           HEADER
        ======================================== */

        .page-header h1 {

            margin-top: 0;

        }

    </style>

</head>


<body>


<!-- ========================================
     HEADER
======================================== -->

<header class="page-header">

    <div>

        <button
            type="button"
            class="attendance-back-button"
            onclick="goBack()">

            ← Back

        </button>


        <h1>
            My Attendance
        </h1>


        <p>
            View your attendance records and progress.
        </p>

    </div>

</header>



<!-- ========================================
     MAIN
======================================== -->

<main class="attendance-page">


    <!-- ========================================
         STATISTICS
    ======================================== -->

    <section class="attendance-stats">


        <div class="stat-card">

            <div class="stat-label">
                Total Classes
            </div>

            <div
                class="stat-value"
                id="totalCount">

                0

            </div>

        </div>



        <div class="stat-card">

            <div class="stat-label">
                Present
            </div>

            <div
                class="stat-value"
                id="presentCount">

                0

            </div>

        </div>



        <div class="stat-card">

            <div class="stat-label">
                Late
            </div>

            <div
                class="stat-value"
                id="lateCount">

                0

            </div>

        </div>



        <div class="stat-card">

            <div class="stat-label">
                Absent
            </div>

            <div
                class="stat-value"
                id="absentCount">

                0

            </div>

        </div>



        <div class="stat-card">

            <div class="stat-label">
                Attendance Rate
            </div>

            <div
                class="stat-value"
                id="attendancePercentage">

                0%

            </div>

        </div>


    </section>



    <!-- ========================================
         MESSAGE
    ======================================== -->

    <div
        id="attendanceMessage"
        class="message"
        style="display:none;">
    </div>



    <!-- ========================================
         HISTORY
    ======================================== -->

    <section class="attendance-history-section">


        <div class="section-header">

            <div>

                <h2>
                    Attendance History
                </h2>

                <p id="attendanceInfo">
                    Your attendance records
                </p>

            </div>

        </div>



        <div class="table-container">

            <table class="attendance-table">


                <thead>

                    <tr>

                        <th>
                            #
                        </th>

                        <th>
                            Date
                        </th>

                        <th>
                            Class
                        </th>

                        <th>
                            Status
                        </th>

                        <th>
                            Note
                        </th>

                    </tr>

                </thead>



                <tbody id="attendanceTableBody">

                    <tr>

                        <td
                            colspan="5"
                            style="
                                text-align:center;
                                padding:40px;
                            ">

                            Loading attendance...

                        </td>

                    </tr>

                </tbody>


            </table>

        </div>

    </section>


</main>



<!-- ========================================
     SUPABASE
======================================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
</script>



<!-- ========================================
     ATTENDANCE JAVASCRIPT
======================================== -->

<script src="js/attendance.js"></script>



<!-- ========================================
     BACK BUTTON JAVASCRIPT
======================================== -->

<script>

function goBack() {

    if (window.history.length > 1) {

        window.history.back();

    } else {

        window.location.href =
            "dashboard.html";

    }

}

</script>
<script src="js/theme.js"></script>

</body>

</html>
