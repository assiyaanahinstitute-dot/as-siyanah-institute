<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password | As-Siyānah Institute</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7f5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .forgot-box {
            width: 90%;
            max-width: 420px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            color: #1d5e3c;
            margin-bottom: 5px;
        }

        h2 {
            text-align: center;
            margin-bottom: 10px;
        }

        .description {
            text-align: center;
            color: #777;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #1d5e3c;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #15482e;
        }

        .links {
            text-align: center;
            margin-top: 25px;
        }

        a {
            color: #1d5e3c;
            text-decoration: none;
            font-weight: bold;
        }

        #message {
            margin-top: 20px;
            text-align: center;
            line-height: 1.5;
        }
    </style>
</head>

<body>

    <div class="forgot-box">

        <h1>As-Siyānah Institute</h1>

        <h2>Forgot Password?</h2>

        <p class="description">
            Enter the email address connected to your account.
            We will send you a secure password recovery link.
        </p>

        <form id="forgotPasswordForm">

            <label for="forgotEmail">
                Email Address
            </label>

            <input
                type="email"
                id="forgotEmail"
                placeholder="Enter your email"
                required
            >

            <button type="submit">
                Send Recovery Link
            </button>

        </form>

        <div id="message"></div>

        <div class="links">

            <p>
                <a href="login.html">
                    ← Back to Student Login
                </a>
            </p>

            <p>
                <a href="teacher-login.html">
                    Teacher Login
                </a>
            </p>

        </div>

    </div>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
    const SUPABASE_URL =
        "https://ridyfpaqoyegdvqmkiyl.supabase.co";

    const SUPABASE_ANON_KEY =
        "sb_publishable_dH1z6RuBIqxN88pyG9YfVA_1niXEWIh";

    const supabaseClient = supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );

    const form = document.getElementById("forgotPasswordForm");
    const message = document.getElementById("message");

    form.addEventListener("submit", async function (event) {

        event.preventDefault();

        const email =
            document.getElementById("forgotEmail").value.trim();

        if (!email) {
            message.textContent = "Please enter your email address.";
            message.style.color = "red";
            return;
        }

        const button = form.querySelector("button");

        button.disabled = true;
        button.textContent = "Sending...";

        try {

            const { error } =
                await supabaseClient.auth.resetPasswordForEmail(
                    email,
                    {
                        redirectTo:
                            window.location.origin +
                            "/reset-password.html"
                    }
                );

            if (error) {
                throw error;
            }

            message.textContent =
                "Recovery link sent! Please check your email.";

            message.style.color = "#1d5e3c";

            form.reset();

        } catch (error) {

            console.error("Password recovery error:", error);

            message.textContent =
                error.message ||
                "Unable to send recovery link.";

            message.style.color = "red";

        } finally {

            button.disabled = false;
            button.textContent = "Send Recovery Link";
        }
    });
</script>
</body>
</html>
