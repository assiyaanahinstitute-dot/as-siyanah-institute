<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Lesson | As-Siyānah Institute</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <style>

        body {
            background: #f5f7f5;
        }

        .lesson-page {
            max-width: 1100px;
            margin: 0 auto;
            padding: 30px 20px 70px;
        }

        .lesson-back {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            color: #17643c;
            font-weight: 700;
            margin-bottom: 25px;
            cursor: pointer;
        }

        .lesson-back:hover {
            text-decoration: underline;
        }

        .lesson-header {
            background:
                linear-gradient(
                    135deg,
                    #1d5e3c,
                    #0b3524
                );

            color: white;
            border-radius: 22px;
            padding: 40px 35px;
            margin-bottom: 25px;

            box-shadow:
                0 15px 35px
                rgba(0, 0, 0, 0.10);
        }

        .lesson-label {
            display: inline-block;
            font-size: 12px;
            letter-spacing: 2px;
            font-weight: 700;
            opacity: 0.8;
            margin-bottom: 12px;
        }

        #lessonTitle {
            font-size: 38px;
            line-height: 1.2;
            margin: 0 0 12px;
        }

        #lessonDescription {
            margin: 0;
            max-width: 750px;
            line-height: 1.7;
            opacity: 0.9;
        }

        .lesson-card {
            background: white;
            border-radius: 22px;
            padding: 25px;
            margin-bottom: 25px;

            box-shadow:
                0 10px 30px
                rgba(0, 0, 0, 0.07);
        }

        .lesson-video-wrapper {
            width: 100%;
            overflow: hidden;
            border-radius: 16px;
            background: #000;
        }

        .lesson-video-player {
            display: block;
            width: 100%;
            max-height: 600px;
            background: #000;
        }

        .lesson-video-error {
            text-align: center;
            padding: 70px 20px;
            background: #f7f9f7;
            border-radius: 16px;
        }

        .lesson-video-icon {
            font-size: 45px;
            margin-bottom: 15px;
        }

        .lesson-video-error h3 {
            margin-bottom: 8px;
        }

        .lesson-video-error p {
            color: #666;
        }

        .lesson-information {
            margin-top: 25px;
        }

        .lesson-information-label {
            display: block;
            color: #1d5e3c;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 1.5px;
            margin-bottom: 8px;
        }

        .lesson-information h2 {
            margin: 0 0 20px;
        }

        .lesson-meta {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .lesson-meta div {
            background: #f5f7f5;
            padding: 18px;
            border-radius: 14px;
        }

        .lesson-meta span {
            display: block;
            font-size: 12px;
            color: #777;
            margin-bottom: 5px;
        }

        .lesson-meta strong {
            color: #173b29;
        }

        .lesson-loading {
            text-align: center;
            padding: 80px 20px;
            color: #666;
        }

        .lesson-spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #dce8df;
            border-top-color: #1d5e3c;
            border-radius: 50%;
            margin: 0 auto 20px;

            animation:
                spin 0.8s linear infinite;
        }

        @keyframes spin {

            to {
                transform: rotate(360deg);
            }

        }

        @media (max-width: 700px) {

            .lesson-page {
                padding: 20px 14px 50px;
            }

            .lesson-header {
                padding: 30px 22px;
                border-radius: 18px;
            }

            #lessonTitle {
                font-size: 28px;
            }

            .lesson-card {
                padding: 15px;
                border-radius: 18px;
            }

            .lesson-meta {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body>


    <main class="lesson-page">


        <!-- BACK TO SUBJECT -->

        <a
            href="#"
            id="backToSubject"
            class="lesson-back"
        >
            ← Back to Subject
        </a>


        <!-- LESSON HEADER -->

        <section class="lesson-header">

            <span class="lesson-label">
                AS-SIYĀNAH INSTITUTE • LESSON
            </span>

            <h1 id="lessonTitle">
                Loading lesson...
            </h1>

            <p id="lessonDescription">
                Please wait while your lesson is loading.
            </p>

        </section>


        <!-- LESSON CONTENT -->

        <section class="lesson-card">

            <div id="lessonContent">

                <div class="lesson-loading">

                    <div class="lesson-spinner"></div>

                    <p>
                        Loading lesson...
                    </p>

                </div>

            </div>

        </section>


    </main>


    <!-- SUPABASE -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <script>

        const SUPABASE_URL =
            "https://ridyfpaqoyegdvqmkiyl.supabase.co";


        const SUPABASE_KEY =
             "sb_publishable_dH1z6RuBIqxN88pyG9YfVA_1niXEWIh";


        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );


        /*
         * BACK TO SUBJECT
         *
         * Get the subject from the URL
         */

        const params =
            new URLSearchParams(
                window.location.search
            );


        const subject =
            params.get("subject");


        const backButton =
            document.getElementById(
                "backToSubject"
            );


        if (subject) {

            backButton.href =
                "subject.html?subject=" +
                encodeURIComponent(subject);

        } else {

            backButton.href =
                "classes.html";

        }

    </script>


    <!-- LESSON JS -->
     <script

src="bttps://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
</script>

    <script src="js/lesson.js"></script>

<script src="js/theme.js"></script>
</body>

</html>
