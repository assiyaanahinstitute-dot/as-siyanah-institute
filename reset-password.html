<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password | As-Siyānah Institute</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7f5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .reset-box {
            width: 90%;
            max-width: 420px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            color: #1d5e3c;
            margin-bottom: 5px;
        }

        h2 {
            text-align: center;
            margin-bottom: 10px;
        }

        .description {
            text-align: center;
            color: #777;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #1d5e3c;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #15482e;
        }

        .links {
            text-align: center;
            margin-top: 25px;
        }

        a {
            color: #1d5e3c;
            text-decoration: none;
            font-weight: bold;
        }

        #resetMessage {
            margin-top: 20px;
            text-align: center;
            line-height: 1.5;
        }
    </style>
</head>

<body>

    <div class="reset-box">

        <h1>As-Siyānah Institute</h1>

        <h2>Create New Password</h2>

        <p class="description">
            Enter a new password for your account.
        </p>

        <form id="resetPasswordForm">

            <label for="newPassword">
                New Password
            </label>

            <input
                type="password"
                id="newPassword"
                placeholder="Enter new password"
                minlength="6"
                required
            >

            <label
                for="confirmPassword"
                style="margin-top: 18px;"
            >
                Confirm New Password
            </label>

            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm new password"
                minlength="6"
                required
            >

            <button type="submit">
                Update Password
            </button>

        </form>

        <div id="resetMessage"></div>

        <div class="links">

            <p>
                <a href="login.html">
                    ← Back to Student Login
                </a>
            </p>

            <p>
                <a href="teacher-login.html">
                    Teacher Login
                </a>
            </p>

        </div>

    </div>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
    const SUPABASE_URL =
        "https://ridyfpaqoyegdvqmkiyl.supabase.co";

    const SUPABASE_ANON_KEY =
        "sb_publishable_dH1z6RuBIqxN88pyG9YfVA_1niXEWIh";

    const supabaseClient = supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );
      
    supabaseClient.auth.onAuthStateChange((event, session) => {

    if (event === "PASSWORD_RECOVERY") {
        console.log("Password recovery session detected.");
    }

});
    const form = document.getElementById("resetPasswordForm");
    const message = document.getElementById("resetMessage");

    form.addEventListener("submit", async function (event) {

        event.preventDefault();

        const newPassword =
            document.getElementById("newPassword").value;

        const confirmPassword =
            document.getElementById("confirmPassword").value;

        if (newPassword !== confirmPassword) {
            message.textContent = "Passwords do not match.";
            message.style.color = "red";
            return;
        }

        if (newPassword.length < 6) {
            message.textContent =
                "Password must be at least 6 characters.";
            message.style.color = "red";
            return;
        }

        const button = form.querySelector("button");

        button.disabled = true;
        button.textContent = "Updating Password...";

        try {

            const { error } =
                await supabaseClient.auth.updateUser({
                    password: newPassword
                });

            if (error) {
                throw error;
            }

            message.textContent =
                "Password updated successfully! You can now log in.";

            message.style.color = "#1d5e3c";

            form.reset();

            setTimeout(() => {
                window.location.href = "teacher-login.html";
            }, 2000);

        } catch (error) {

            console.error("Password reset error:", error);

            message.textContent =
                error.message ||
                "Unable to update password.";

            message.style.color = "red";

            button.disabled = false;
            button.textContent = "Update Password";
        }
    });
</script>
</body>
</html>
